<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><link rel="manifest" href="/manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Trigvox</title><style>
:root{--bg:#030914;--card:#0b192b;--card2:#10233a;--line:#1b3857;--text:#f7fbff;--muted:#91a7bd;--blue:#14bdf4;--blue2:#2464ff;--red:#ff5266;--green:#27d7a2}*{box-sizing:border-box}body{margin:0;background:#020711;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:430px;max-width:100%;height:850px;max-height:96vh;background:linear-gradient(160deg,#071528,#04101e);border:7px solid #151c28;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 25px 90px #000}.status{height:30px;padding:8px 16px 0;display:flex;justify-content:space-between;font-size:11px;color:#dbe9f8}.screen{height:calc(100% - 30px);overflow:auto;padding:20px 18px 92px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.logo{width:82px;height:82px;border-radius:25px;border:2px solid var(--blue);display:grid;place-items:center;box-shadow:0 0 35px #0ba9f655;margin:auto}.logo svg{width:64px}.brand{font-size:42px;font-weight:950;letter-spacing:-2px}.brand span{color:var(--blue)}.center{text-align:center}.tag{font-size:9px;letter-spacing:3px;color:#b5c6d9;margin-top:5px}.splash{height:100%;display:grid;place-items:center}.muted{color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:900}.avatar{width:44px;height:44px;border-radius:14px;background:#12304e;display:grid;place-items:center;color:var(--blue);font-weight:900}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#087ff4,#294de8);margin-bottom:20px;box-shadow:0 18px 40px #006eff22}.hero .tiny{font-size:10px;letter-spacing:1.4px;color:#d9efff;font-weight:800}.hero h2{margin:6px 0;font-size:25px}.section{font-weight:900;font-size:17px;margin:18px 0 10px}.card,.row{background:#0b1a2d;border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.row{display:flex;align-items:center;gap:12px;cursor:pointer}.icon{width:44px;height:44px;border-radius:13px;background:#14304d;display:grid;place-items:center;font-size:21px}.grow{flex:1}.name{font-weight:850}.num,.small{font-size:11px;color:var(--muted);margin-top:3px}.call{width:40px;height:40px;border-radius:13px;background:#113b61;color:var(--blue);display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 15px;color:#fff;font-weight:850;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#078ff7,#2461ff)}.secondary{background:#123454;color:#7bdbff}.danger{width:100%;background:transparent;border:1px solid #e44d60;color:#ff7381}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:850;letter-spacing:1px}.field input,.field select{width:100%;margin-top:7px;padding:13px;border-radius:12px;background:#08182a;border:1px solid #203c59;color:#fff;outline:none}.tabs{display:flex;gap:7px;margin-bottom:18px}.tabs button{flex:1;border:1px solid var(--line);background:#0b1a2d;color:var(--muted);padding:10px;border-radius:11px}.tabs .on{color:#fff;border-color:#178fe9;background:#103250}.nav{position:absolute;bottom:10px;left:10px;right:10px;height:64px;border:1px solid var(--line);background:#081628f2;border-radius:20px;display:flex;justify-content:space-around;align-items:center}.nav button{background:none;border:0;color:#748ba2;font-size:10px;cursor:pointer}.nav b{display:block;font-size:18px;margin-bottom:2px}.nav .active{color:#25c5ff}.listrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #16304a}.switch{width:46px;height:25px;border-radius:20px;background:#263b51;position:relative;cursor:pointer}.switch i{width:19px;height:19px;background:#fff;border-radius:50%;position:absolute;top:3px;left:4px;transition:.2s}.switch.on{background:#138fe8}.switch.on i{left:23px}.overlay{position:absolute;inset:0;background:#010713ed;z-index:20;display:grid;place-items:center;padding:20px}.modal{width:100%;background:#0b1b2e;border:1px solid #244764;border-radius:25px;padding:24px;text-align:center}.count{font-size:72px;font-weight:950;color:#26c8ff}.ring{width:76px;height:76px;border:3px solid var(--blue);border-radius:50%;display:grid;place-items:center;margin:auto}.toast{position:absolute;top:40px;left:18px;right:18px;background:#10304a;border:1px solid #23618a;padding:12px;border-radius:12px;text-align:center;z-index:30;font-size:12px}.error{color:#ff7a88;font-size:12px}.ok{color:#45e1b0;font-size:12px}.link{color:#4fd2ff;cursor:pointer}.empty{text-align:center;padding:40px;color:var(--muted)}
</style></head><body><div class="shell"><main class="app"><div class="status"><span id="clock"></span><span>● ● ▮</span></div><div id="screen" class="screen"></div></main></div><script>
const KEY='trigvox_v3';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:{},session:null};let page='splash',authMode='login',pending=null,count=0,recog=null,locationData=null;
const demoContacts=[{name:'Mom',phone:'+919876543210',icon:'👩'},{name:'Dad',phone:'+918765432109',icon:'👨'},{name:'Brother',phone:'+919123456789',icon:'🧑'}];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function user(){return db.session?db.users[db.session]:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function logo(){return `<div class="logo"><svg viewBox="0 0 100 100"><path fill="#12bff4" d="M12 15h58L55 29H45v51L29 68V29H18z"/><path fill="#1599ff" d="M69 15h18L61 57 48 46z"/><path fill="white" d="M51 50c-5-3-9-1-11 3-2 5 1 10 8 16 7 6 12 7 16 3 3-3 3-7 0-11l-5-4-6 5c-3-2-5-4-7-7z"/><path fill="#11bff3" d="M76 46c6 5 6 12 0 17l-3-3c4-3 4-8 0-11zM83 40c10 9 10 21 0 30l-3-3c8-7 8-17 0-24z"/></svg></div>`}
function nav(){return `<div class="nav">${[['⌂','Home','home'],['☎','Contacts','contacts'],['◷','History','history'],['⚙','Settings','settings']].map(x=>`<button class="${page===x[2]?'active':''}" onclick="go('${x[2]}')"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>`}
function render(){const s=document.getElementById('screen');if(page==='splash'){s.innerHTML=`<div class="splash center">${logo()}<div><div class="brand">Trig<span>vox</span></div><div class="tag">TRIGGER · CALL · CONNECT</div><p class="muted">Secure quick-call companion</p></div></div>`;setTimeout(()=>{page=db.session?'home':'auth';render()},800);return}if(page==='auth')return auth();if(!user()){page='auth';return render()}if(page==='home')home();if(page==='contacts')contacts();if(page==='history')history();if(page==='settings')settings()}
function auth(){document.getElementById('screen').innerHTML=`<div class="center" style="margin-top:35px">${logo()}<div class="brand" style="font-size:38px;margin-top:14px">Trig<span>vox</span></div><p class="muted">${authMode==='login'?'Sign in to your account':'Create your Trigvox account'}</p></div><div class="tabs"><button class="${authMode==='login'?'on':''}" onclick="authMode='login';render()">Login</button><button class="${authMode==='signup'?'on':''}" onclick="authMode='signup';render()">Create account</button></div><div class="card"><div class="field"><label>EMAIL</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" placeholder="••••••••"></div>${authMode==='signup'?`<div class="field"><label>NAME</label><input id="name" placeholder="Your name"></div>`:''}<button class="btn primary" onclick="submitAuth()">${authMode==='login'?'Login':'Create account'}</button><div id="authmsg" class="small" style="margin-top:10px">Accounts in this demo are stored only on this device/browser.</div></div>`}
function submitAuth(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('pass').value,n=document.getElementById('name')?.value.trim();if(!e||!p)return msg('authmsg','Enter email and password.','error');if(authMode==='signup'){if(p.length<6)return msg('authmsg','Password must be at least 6 characters.','error');if(db.users[e])return msg('authmsg','Account already exists.','error');db.users[e]={email:e,name:n||e.split('@')[0],contacts:demoContacts.map(x=>({...x})),history:[],settings:{shareLocation:false,policeFallback:false,policeNumber:'112',beeps:true,cancelPhrase:'Cancel call'}};db.session=e;save();page='home';render()}else{if(!db.users[e]||db.users[e].password!==p)return msg('authmsg','Login details not found. Create an account or check your password.','error');db.session=e;save();page='home';render()}}
// store password locally only for prototype; production should use Supabase/Firebase/Auth backend.
const oldSubmit=submitAuth;window.submitAuth=function(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('pass').value,n=document.getElementById('name')?.value.trim();if(authMode==='signup'){if(!e||!p||p.length<6)return msg('authmsg','Use a valid email and password (6+ characters).','error');if(db.users[e])return msg('authmsg','Account already exists.','error');db.users[e]={email:e,name:n||e.split('@')[0],password:p,contacts:demoContacts.map(x=>({...x})),history:[],settings:{shareLocation:false,policeFallback:false,policeNumber:'112',beeps:true,cancelPhrase:'Cancel call'}};db.session=e;save();page='home';render()}else{if(!e||!p)return msg('authmsg','Enter email and password.','error');if(!db.users[e]||db.users[e].password!==p)return msg('authmsg','Invalid email or password.','error');db.session=e;save();page='home';render()}};
function msg(id,t,c){let x=document.getElementById(id);if(x){x.className=c||'small';x.textContent=t}}
function go(p){page=p;render()}
function home(){let u=user();document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Hello, ${esc(u.name)} 👋</div><div class="muted">Ready when you need help.</div></div><div class="avatar">${esc(u.name[0]||'T').toUpperCase()}</div></div><div class="hero"><div class="tiny">TRIGVOX PROTECTION</div><h2>Quick call + location</h2><p>Trigger a call to a registered contact with a visible safety countdown.</p></div><div class="section">Quick call</div>${u.contacts.map((c,i)=>`<div class="row" onclick="trigger(${i})"><div class="icon">${c.icon||'👤'}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="num">${esc(c.phone)}</div></div><div class="call">☎</div></div>`).join('')}<div class="section">Safety status</div><div class="card"><div class="listrow"><span>Location sharing</span><span class="${u.settings.shareLocation?'ok':'muted'}">${u.settings.shareLocation?'ON':'OFF'}</span></div><div class="listrow"><span>Emergency fallback</span><span class="${u.settings.policeFallback?'ok':'muted'}">${u.settings.policeFallback?'ON':'OFF'}</span></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="go('settings')">Open settings</button></div>${nav()}`}
function contacts(){let u=user();document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Contacts</div><div class="muted">Only registered contacts can be triggered.</div></div></div>${u.contacts.map((c,i)=>`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="icon">${c.icon||'👤'}</div><div class="grow"><b>${esc(c.name)}</b><div class="num">${esc(c.phone)}</div></div><button class="btn danger" style="width:auto" onclick="removeContact(${i})">Remove</button></div></div>`).join('')}<div class="card"><b>Add trusted contact</b><div class="field"><label>NAME</label><input id="cn" placeholder="Mom"></div><div class="field"><label>PHONE</label><input id="cp" placeholder="+91..."></div><button class="btn primary" onclick="addContact()">Add contact</button></div>${nav()}`}
function addContact(){let u=user(),n=document.getElementById('cn').value.trim(),p=document.getElementById('cp').value.trim();if(!n||!p)return toast('Enter name and phone number');u.contacts.push({name:n,phone:p,icon:'👤'});save();render()};function removeContact(i){user().contacts.splice(i,1);save();render()}
function history(){let u=user();document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">History</div><div class="muted">Stored locally for this web version.</div></div></div>${u.history.length?u.history.map(h=>`<div class="card"><b>☎ ${esc(h.name)}</b><div class="num">${esc(h.phone)} · ${esc(h.time)}</div>${h.location?`<div class="small">Location shared: yes</div>`:''}</div>`).join(''):`<div class="empty">No calls yet.</div>`}<button class="btn danger" onclick="user().history=[];save();render()">Clear history</button>${nav()}`}
function settings(){let u=user(),st=u.settings||{};if(!st.cancelPhrase)st.cancelPhrase='Cancel call';if(!st.policeNumber)st.policeNumber='112';if(typeof st.beeps!=='boolean')st.beeps=true;save();document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Settings</div><div class="muted">Control your Trigvox safety features.</div></div></div><div class="card"><b>Account</b><div class="num">${esc(u.name)} · ${esc(u.email)}</div></div><div class="card"><div class="listrow"><div><b>Share current location</b><div class="small">Request location permission when a call is triggered.</div></div><div class="switch ${st.shareLocation?'on':''}" onclick="toggle('shareLocation')"><i></i></div></div><div class="listrow"><div><b>Emergency fallback</b><div class="small">If enabled, offer ${esc(st.policeNumber)} after the contact call attempt.</div></div><div class="switch ${st.policeFallback?'on':''}" onclick="toggle('policeFallback')"><i></i></div></div><div class="field"><label>EMERGENCY NUMBER</label><input value="${esc(st.policeNumber)}" onchange="user().settings.policeNumber=this.value.trim();save()" placeholder="112"></div><div class="field" style="padding:14px;border:1px solid #1d6fa5;border-radius:14px;background:#0a2138"><label style="color:#35caff">VOICE CANCELLATION PHRASE</label><input id="cancelPhrase" value="${esc(st.cancelPhrase||'Cancel call')}" onchange="setCancelPhrase(this.value)" placeholder="e.g. Stop TrigVox"><div class="small">Set the exact phrase you want to say during the countdown to cancel the call. Example: “Stop TrigVox”.</div></div><div class="listrow"><span>Countdown beeps</span><div class="switch ${st.beeps?'on':''}" onclick="toggle('beeps')"><i></i></div></div></div><div class="card"><b>Privacy</b><p class="small">This hosted demo keeps account data, contacts and history in this browser. It does not provide a secure cloud account system. Production deployment should use a real authentication/database backend.</p></div><button class="btn danger" onclick="db.session=null;save();page='auth';render()">Sign out</button>${nav()}`}
function setCancelPhrase(v){v=(v||'').trim().replace(/\\s+/g,' ');if(v.length<3)return toast('Phrase must be at least 3 characters');user().settings.cancelPhrase=v;save();toast('Voice cancel phrase saved')}
function toggle(k){user().settings[k]=!user().settings[k];save();render()}
function getLocation(cb){if(!user().settings.shareLocation)return cb(null);if(!navigator.geolocation)return cb(null);navigator.geolocation.getCurrentPosition(pos=>{locationData={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy)};cb(locationData)},()=>cb(null),{enableHighAccuracy:true,timeout:7000,maximumAge:0})}
function trigger(i){let c=user().contacts[i];getLocation(loc=>{pending={...c,loc};count=10;showCountdown()})}
function showCountdown(){let c=pending,o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML=`<div class="modal"><div class="ring">☎</div><div class="muted" style="margin-top:14px">CALL REQUEST</div><h2>Calling ${esc(c.name)}</h2><div class="small">${esc(c.phone)}</div>${c.loc?`<div class="ok" style="margin-top:10px">✓ Current location ready to share</div>`:`<div class="small" style="margin-top:10px">Location sharing is ${user().settings.shareLocation?'waiting for permission':'off'}</div>`}<div class="small" style="margin-top:16px">Starting in</div><div class="count" id="count">${count}</div><b>Say “${esc(user().settings.cancelPhrase||'Cancel call')}” to stop</b><div class="small" id="listen" style="margin-top:9px">🎙 Voice cancellation enabled where supported.</div></div>`;document.querySelector('.app').appendChild(o);beep();startRecog();tick()}
function tick(){if(!pending)return;if(count>0){document.getElementById('count').textContent=count;if(user().settings.beeps)beep(count<=3?1000:700,count<=3?140:80);count--;setTimeout(tick,1000)}else finish()}
function beep(freq=700,d=110){try{let C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.10;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},d)}catch(e){}}
function startRecog(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{recog=new SR();recog.lang='en-IN';recog.continuous=true;recog.interimResults=false;recog.onresult=e=>{let t=e.results[e.results.length-1][0].transcript.toLowerCase();let phrase=(user().settings.cancelPhrase||'Cancel call').trim().toLowerCase();
if(phrase && t.includes(phrase)) cancel()};recog.onend=()=>{if(pending)try{recog.start()}catch(e){}};recog.start()}catch(e){}}
function stopRecog(){if(recog){try{recog.onend=null;recog.stop()}catch(e){}recog=null}}
function cancel(){stopRecog();pending=null;document.getElementById('overlay')?.remove();toast('Call cancelled')}
function finish(){let c=pending;stopRecog();let h={name:c.name,phone:c.phone,time:new Date().toLocaleString(),location:!!c.loc};user().history.unshift(h);user().history=user().history.slice(0,50);save();pending=null;document.getElementById('overlay')?.remove();toast('Opening phone call…');setTimeout(()=>{location.href='tel:'+c.phone.replace(/[^+\d]/g,'')},350);if(c.loc){let maps=`https://maps.google.com/?q=${c.loc.lat},${c.loc.lng}`;let text=`Trigvox safety alert. My current location: ${maps}`;setTimeout(()=>{if(confirm('Location is ready. Open SMS to share it with '+c.name+'?'))location.href='sms:'+c.phone.replace(/[^+\d]/g,'')+'?body='+encodeURIComponent(text)},900)}if(user().settings.policeFallback){setTimeout(()=>{if(confirm('Did '+c.name+' not answer? Open emergency call to '+user().settings.policeNumber+'?'))location.href='tel:'+user().settings.policeNumber.replace(/\D/g,'')},4000)}}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.querySelector('.app').appendChild(x);setTimeout(()=>x.remove(),2300)}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);render();
</script></body></html>
