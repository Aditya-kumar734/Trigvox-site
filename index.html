<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><link rel="manifest" href="/manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Trigvox</title><style>
:root{--bg:#030914;--card:#0b192b;--card2:#10233a;--line:#1b3857;--text:#f7fbff;--muted:#91a7bd;--blue:#14bdf4;--blue2:#2464ff;--red:#ff5266;--green:#27d7a2}*{box-sizing:border-box}body{margin:0;background:#020711;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:430px;max-width:100%;height:850px;max-height:96vh;background:linear-gradient(160deg,#071528,#04101e);border:7px solid #151c28;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 25px 90px #000}.status{height:30px;padding:8px 16px 0;display:flex;justify-content:space-between;font-size:11px;color:#dbe9f8}.screen{height:calc(100% - 30px);overflow:auto;padding:20px 18px 92px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.logo{width:82px;height:82px;border-radius:25px;border:2px solid var(--blue);display:grid;place-items:center;box-shadow:0 0 35px #0ba9f655;margin:auto}.logo svg{width:64px}.brand{font-size:42px;font-weight:950;letter-spacing:-2px}.brand span{color:var(--blue)}.center{text-align:center}.tag{font-size:9px;letter-spacing:3px;color:#b5c6d9;margin-top:5px}.splash{height:100%;display:grid;place-items:center}.muted{color:var(--muted);font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:900}.avatar{width:44px;height:44px;border-radius:14px;background:#12304e;display:grid;place-items:center;color:var(--blue);font-weight:900}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#087ff4,#294de8);margin-bottom:20px;box-shadow:0 18px 40px #006eff22}.hero .tiny{font-size:10px;letter-spacing:1.4px;color:#d9efff;font-weight:800}.hero h2{margin:6px 0;font-size:25px}.section{font-weight:900;font-size:17px;margin:18px 0 10px}.card,.row{background:#0b1a2d;border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.row{display:flex;align-items:center;gap:12px;cursor:pointer}.icon{width:44px;height:44px;border-radius:13px;background:#14304d;display:grid;place-items:center;font-size:21px}.grow{flex:1}.name{font-weight:850}.num,.small{font-size:11px;color:var(--muted);margin-top:3px}.call{width:40px;height:40px;border-radius:13px;background:#113b61;color:var(--blue);display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 15px;color:#fff;font-weight:850;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#078ff7,#2461ff)}.secondary{background:#123454;color:#7bdbff}.danger{width:100%;background:transparent;border:1px solid #e44d60;color:#ff7381}.field{margin:10px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:850;letter-spacing:1px}.field input,.field select{width:100%;margin-top:7px;padding:13px;border-radius:12px;background:#08182a;border:1px solid #203c59;color:#fff;outline:none}.tabs{display:flex;gap:7px;margin-bottom:18px}.tabs button{flex:1;border:1px solid var(--line);background:#0b1a2d;color:var(--muted);padding:10px;border-radius:11px}.tabs .on{color:#fff;border-color:#178fe9;background:#103250}.nav{position:absolute;bottom:10px;left:10px;right:10px;height:64px;border:1px solid var(--line);background:#081628f2;border-radius:20px;display:flex;justify-content:space-around;align-items:center}.nav button{background:none;border:0;color:#748ba2;font-size:10px;cursor:pointer}.nav b{display:block;font-size:18px;margin-bottom:2px}.nav .active{color:#25c5ff}.listrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #16304a}.switch{width:46px;height:25px;border-radius:20px;background:#263b51;position:relative;cursor:pointer}.switch i{width:19px;height:19px;background:#fff;border-radius:50%;position:absolute;top:3px;left:4px;transition:.2s}.switch.on{background:#138fe8}.switch.on i{left:23px}.overlay{position:absolute;inset:0;background:#010713ed;z-index:20;display:grid;place-items:center;padding:20px}.modal{width:100%;background:#0b1b2e;border:1px solid #244764;border-radius:25px;padding:24px;text-align:center}.count{font-size:72px;font-weight:950;color:#26c8ff}.ring{width:76px;height:76px;border:3px solid var(--blue);border-radius:50%;display:grid;place-items:center;margin:auto}.toast{position:absolute;top:40px;left:18px;right:18px;background:#10304a;border:1px solid #23618a;padding:12px;border-radius:12px;text-align:center;z-index:30;font-size:12px}.error{color:#ff7a88;font-size:12px}.ok{color:#45e1b0;font-size:12px}.link{color:#4fd2ff;cursor:pointer}.empty{text-align:center;padding:40px;color:var(--muted)}
</style></head><body><div class="shell"><main class="app"><div class="status"><span id="clock"></span><span>● ● ▮</span></div><div id="screen" class="screen"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
// ================= SUPABASE CONFIG =================
// Replace these two values with your Supabase project's URL and anon/public key.
const SUPABASE_URL=window.TRIGVOX_SUPABASE_URL||'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY=window.TRIGVOX_SUPABASE_ANON_KEY||'YOUR_SUPABASE_ANON_KEY';
const SUPABASE_READY=!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
const sb=SUPABASE_READY?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

let page='splash',authMode='login',pending=null,count=0,recog=null,locationData=null;
let currentUser=null,profile=null,contacts=[],historyItems=[];
const demoContacts=[{name:'Mom',phone:'+919876543210',icon:'👩'},{name:'Dad',phone:'+918765432109',icon:'👨'},{name:'Brother',phone:'+919123456789',icon:'🧑'}];
const defaultSettings={shareLocation:false,policeFallback:false,policeNumber:'112',beeps:true,cancelPhrase:'Cancel call'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function logo(){return `<div class="logo"><svg viewBox="0 0 100 100"><path fill="#12bff4" d="M12 15h58L55 29H45v51L29 68V29H18z"/><path fill="#1599ff" d="M69 15h18L61 57 48 46z"/><path fill="white" d="M51 50c-5-3-9-1-11 3-2 5 1 10 8 16 7 6 12 7 16 3 3-3 3-7 0-11l-5-4-6 5c-3-2-5-4-7-7z"/><path fill="#11bff3" d="M76 46c6 5 6 12 0 17l-3-3c4-3 4-8 0-11zM83 40c10 9 10 21 0 30l-3-3c8-7 8-17 0-24z"/></svg></div>`}
function nav(){return `<div class="nav">${[['⌂','Home','home'],['☎','Contacts','contacts'],['◷','History','history'],['⚙','Settings','settings']].map(x=>`<button class="${page===x[2]?'active':''}" onclick="go('${x[2]}')"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>`}
function msg(id,t,c){let x=document.getElementById(id);if(x){x.className=c||'small';x.textContent=t}}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.querySelector('.app').appendChild(x);setTimeout(()=>x.remove(),2300)}
function setupMessage(){return `<div class="card" style="border-color:#e0a33b"><b>Supabase setup required</b><p class="small">Open <b>supabase-config.js</b> in this folder and enter your Supabase Project URL and anon/public key. Then open the app again.</p><p class="small">The database SQL is included in <b>supabase-schema.sql</b>.</p></div>`}

async function loadData(){
  if(!sb||!currentUser)return;
  const [{data:p,error:pe},{data:c,error:ce},{data:h,error:he}]=await Promise.all([
    sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle(),
    sb.from('contacts').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:true}),
    sb.from('call_history').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(50)
  ]);
  if(pe||ce||he){console.error(pe||ce||he);toast('Could not load your cloud data. Check the Supabase tables/RLS.');}
  profile=p||{id:currentUser.id,name:currentUser.user_metadata?.name||currentUser.email?.split('@')[0]||'User',settings:{...defaultSettings}};
  profile.settings={...defaultSettings,...(profile.settings||{})};
  contacts=c||[];historyItems=h||[];
}
async function ensureProfile(){
  if(!sb||!currentUser)return;
  const {data}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(!data){
    const name=currentUser.user_metadata?.name||currentUser.email?.split('@')[0]||'User';
    await sb.from('profiles').insert({id:currentUser.id,name,settings:defaultSettings});
  }
  await loadData();
}
async function render(){
  const s=document.getElementById('screen');
  if(page==='splash'){s.innerHTML=`<div class="splash center">${logo()}<div><div class="brand">Trig<span>vox</span></div><div class="tag">TRIGGER · CALL · CONNECT</div><p class="muted">Secure quick-call companion</p></div></div>`;setTimeout(async()=>{if(!SUPABASE_READY){page='auth';render();return}const {data}=await sb.auth.getSession();if(data.session){currentUser=data.session.user;await loadData();page='home'}else page='auth';render()},800);return}
  if(page==='auth')return auth();
  if(!currentUser){page='auth';return render();}
  if(!profile)await loadData();
  if(page==='home')home();if(page==='contacts')contactsPage();if(page==='history')historyPage();if(page==='settings')settingsPage();
}
function auth(){document.getElementById('screen').innerHTML=`<div class="center" style="margin-top:35px">${logo()}<div class="brand" style="font-size:38px;margin-top:14px">Trig<span>vox</span></div><p class="muted">${authMode==='login'?'Sign in to your cloud account':'Create your cloud account'}</p></div>${!SUPABASE_READY?setupMessage():''}<div class="tabs"><button class="${authMode==='login'?'on':''}" onclick="authMode='login';render()">Login</button><button class="${authMode==='signup'?'on':''}" onclick="authMode='signup';render()">Create account</button></div><div class="card"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="••••••••</div>${authMode==='signup'?`<div class="field"><label>NAME</label><input id="name" autocomplete="name" placeholder="Your name"></div>`:''}<button class="btn primary" onclick="submitAuth()" ${!SUPABASE_READY?'disabled':''}>${authMode==='login'?'Login':'Create account'}</button><div id="authmsg" class="small" style="margin-top:10px">Your account and app data will be stored in Supabase.</div></div>`}
async function submitAuth(){
  if(!SUPABASE_READY)return msg('authmsg','Add your Supabase URL and anon key first.','error');
  const e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('pass').value,n=document.getElementById('name')?.value.trim();
  if(!e||!p)return msg('authmsg','Enter email and password.','error');
  if(p.length<6)return msg('authmsg','Password must be at least 6 characters.','error');
  msg('authmsg','Please wait…','small');
  let result;
  if(authMode==='signup')result=await sb.auth.signUp({email:e,password:p,options:{data:{name:n||e.split('@')[0]}}});
  else result=await sb.auth.signInWithPassword({email:e,password:p});
  if(result.error)return msg('authmsg',result.error.message,'error');
  if(authMode==='signup'&&!result.data.session){return msg('authmsg','Account created. Check your email to confirm the account, then log in.','ok')}
  currentUser=result.data.user;await ensureProfile();page='home';render();
}
function go(p){page=p;render()}
function settingsObj(){profile.settings={...defaultSettings,...(profile.settings||{})};return profile.settings}
function home(){let st=settingsObj(),name=profile?.name||currentUser.email?.split('@')[0]||'User';document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Hello, ${esc(name)} 👋</div><div class="muted">Ready when you need help.</div></div><div class="avatar">${esc(name[0]||'T').toUpperCase()}</div></div><div class="hero"><div class="tiny">TRIGVOX PROTECTION</div><h2>Quick call + location</h2><p>Trigger a call to a registered contact with a visible safety countdown.</p></div><div class="section">Quick call</div>${contacts.length?contacts.map((c,i)=>`<div class="row" onclick="trigger(${i})"><div class="icon">${c.icon||'👤'}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="num">${esc(c.phone)}</div></div><div class="call">☎</div></div>`).join(''):`<div class="empty">Add a trusted contact to start.</div>`}<div class="section">Safety status</div><div class="card"><div class="listrow"><span>Location sharing</span><span class="${st.shareLocation?'ok':'muted'}">${st.shareLocation?'ON':'OFF'}</span></div><div class="listrow"><span>Emergency fallback</span><span class="${st.policeFallback?'ok':'muted'}">${st.policeFallback?'ON':'OFF'}</span></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="go('settings')">Open settings</button></div>${nav()}`}
function contactsPage(){document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Contacts</div><div class="muted">Saved in your Supabase account.</div></div></div>${contacts.map((c,i)=>`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="icon">${c.icon||'👤'}</div><div class="grow"><b>${esc(c.name)}</b><div class="num">${esc(c.phone)}</div></div><button class="btn danger" style="width:auto" onclick="removeContact(${i})">Remove</button></div></div>`).join('')}<div class="card"><b>Add trusted contact</b><div class="field"><label>NAME</label><input id="cn" placeholder="Mom"></div><div class="field"><label>PHONE</label><input id="cp" placeholder="+91..."></div><button class="btn primary" onclick="addContact()">Add contact</button></div>${nav()}`}
async function addContact(){let n=document.getElementById('cn').value.trim(),p=document.getElementById('cp').value.trim();if(!n||!p)return toast('Enter name and phone number');const {data,error}=await sb.from('contacts').insert({user_id:currentUser.id,name:n,phone:p,icon:'👤'}).select().single();if(error)return toast(error.message);contacts.push(data);render()}
async function removeContact(i){const c=contacts[i];if(!c)return;const {error}=await sb.from('contacts').delete().eq('id',c.id).eq('user_id',currentUser.id);if(error)return toast(error.message);contacts.splice(i,1);render()}
function historyPage(){document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">History</div><div class="muted">Synced to your Supabase account.</div></div></div>${historyItems.length?historyItems.map(h=>`<div class="card"><b>☎ ${esc(h.contact_name)}</b><div class="num">${esc(h.phone)} · ${esc(new Date(h.created_at).toLocaleString())}</div>${h.location_shared?`<div class="small">Location shared: yes</div>`:''}</div>`).join(''):`<div class="empty">No calls yet.</div>`}<button class="btn danger" onclick="clearHistory()">Clear history</button>${nav()}`}
async function clearHistory(){const {error}=await sb.from('call_history').delete().eq('user_id',currentUser.id);if(error)return toast(error.message);historyItems=[];render()}
function settingsPage(){let st=settingsObj();document.getElementById('screen').innerHTML=`<div class="top"><div><div class="title">Settings</div><div class="muted">Your settings are stored in Supabase.</div></div></div><div class="card"><b>Account</b><div class="num">${esc(profile.name)} · ${esc(currentUser.email||'')}</div></div><div class="card"><div class="listrow"><div><b>Share current location</b><div class="small">Request location permission when a call is triggered.</div></div><div class="switch ${st.shareLocation?'on':''}" onclick="toggleSetting('shareLocation')"><i></i></div></div><div class="listrow"><div><b>Emergency fallback</b><div class="small">If enabled, offer ${esc(st.policeNumber)} after the contact call attempt.</div></div><div class="switch ${st.policeFallback?'on':''}" onclick="toggleSetting('policeFallback')"><i></i></div></div><div class="field"><label>EMERGENCY NUMBER</label><input value="${esc(st.policeNumber)}" onchange="saveSetting('policeNumber',this.value.trim())" placeholder="112"></div><div class="field" style="padding:14px;border:1px solid #1d6fa5;border-radius:14px;background:#0a2138"><label style="color:#35caff">VOICE CANCELLATION PHRASE</label><input id="cancelPhrase" value="${esc(st.cancelPhrase)}" onchange="setCancelPhrase(this.value)" placeholder="e.g. Stop TrigVox"><div class="small">Say this phrase during the countdown to cancel the call.</div></div><div class="listrow"><span>Countdown beeps</span><div class="switch ${st.beeps?'on':''}" onclick="toggleSetting('beeps')"><i></i></div></div></div><div class="card"><b>Cloud storage</b><p class="small">Authentication, profile, contacts, settings and call history are stored in Supabase. Your password is handled by Supabase Auth and is not stored by this app.</p></div><button class="btn danger" onclick="signOut()">Sign out</button>${nav()}`}
async function saveProfile(){const {error}=await sb.from('profiles').update({name:profile.name,settings:profile.settings,updated_at:new Date().toISOString()}).eq('id',currentUser.id);if(error)toast(error.message)}
async function toggleSetting(k){profile.settings[k]=!profile.settings[k];await saveProfile();render()}
async function saveSetting(k,v){profile.settings[k]=v;await saveProfile()}
async function setCancelPhrase(v){v=(v||'').trim().replace(/\s+/g,' ');if(v.length<3)return toast('Phrase must be at least 3 characters');profile.settings.cancelPhrase=v;await saveProfile();toast('Voice cancel phrase saved')}
async function signOut(){await sb.auth.signOut();currentUser=null;profile=null;contacts=[];historyItems=[];page='auth';render()}
function getLocation(cb){if(!settingsObj().shareLocation)return cb(null);if(!navigator.geolocation)return cb(null);navigator.geolocation.getCurrentPosition(pos=>{locationData={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy)};cb(locationData)},()=>cb(null),{enableHighAccuracy:true,timeout:7000,maximumAge:0})}
function trigger(i){let c=contacts[i];if(!c)return;getLocation(loc=>{pending={...c,loc};count=10;showCountdown()})}
function showCountdown(){let c=pending,o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML=`<div class="modal"><div class="ring">☎</div><div class="muted" style="margin-top:14px">CALL REQUEST</div><h2>Calling ${esc(c.name)}</h2><div class="small">${esc(c.phone)}</div>${c.loc?`<div class="ok" style="margin-top:10px">✓ Current location ready to share</div>`:`<div class="small" style="margin-top:10px">Location sharing is ${settingsObj().shareLocation?'waiting for permission':'off'}</div>`}<div class="small" style="margin-top:16px">Starting in</div><div class="count" id="count">${count}</div><b>Say “${esc(settingsObj().cancelPhrase)}” to stop</b><div class="small" id="listen" style="margin-top:9px">🎙 Voice cancellation enabled where supported.</div></div>`;document.querySelector('.app').appendChild(o);beep();startRecog();tick()}
function tick(){if(!pending)return;if(count>0){document.getElementById('count').textContent=count;if(settingsObj().beeps)beep(count<=3?1000:700,count<=3?140:80);count--;setTimeout(tick,1000)}else finish()}
function beep(freq=700,d=110){try{let C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.10;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},d)}catch(e){}}
function startRecog(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{recog=new SR();recog.lang='en-IN';recog.continuous=true;recog.interimResults=false;recog.onresult=e=>{let t=e.results[e.results.length-1][0].transcript.toLowerCase();let phrase=(settingsObj().cancelPhrase||'Cancel call').trim().toLowerCase();if(phrase&&t.includes(phrase))cancel()};recog.onend=()=>{if(pending)try{recog.start()}catch(e){}};recog.start()}catch(e){}}
function stopRecog(){if(recog){try{recog.onend=null;recog.stop()}catch(e){}recog=null}}
function cancel(){stopRecog();pending=null;document.getElementById('overlay')?.remove();toast('Call cancelled')}
async function finish(){let c=pending;stopRecog();const row={user_id:currentUser.id,contact_name:c.name,phone:c.phone,location_shared:!!c.loc,latitude:c.loc?.lat||null,longitude:c.loc?.lng||null};const {data,error}=await sb.from('call_history').insert(row).select().single();if(!error&&data)historyItems.unshift(data);pending=null;document.getElementById('overlay')?.remove();toast('Opening phone call…');setTimeout(()=>{location.href='tel:'+c.phone.replace(/[^+\d]/g,'')},350);if(c.loc){let maps=`https://maps.google.com/?q=${c.loc.lat},${c.loc.lng}`;let text=`Trigvox safety alert. My current location: ${maps}`;setTimeout(()=>{if(confirm('Location is ready. Open SMS to share it with '+c.name+'?'))location.href='sms:'+c.phone.replace(/[^+\d]/g,'')+'?body='+encodeURIComponent(text)},900)}if(settingsObj().policeFallback){setTimeout(()=>{if(confirm('Did '+c.name+' not answer? Open emergency call to '+settingsObj().policeNumber+'?'))location.href='tel:'+settingsObj().policeNumber.replace(/\D/g,'')},4000)}}
if(SUPABASE_READY){sb.auth.onAuthStateChange(async(_event,session)=>{if(session){currentUser=session.user;if(!profile){await ensureProfile();if(page==='splash'||page==='auth'){page='home';render()}}}else{currentUser=null;profile=null;contacts=[];historyItems=[]}})}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);render();
</script></body></html>
